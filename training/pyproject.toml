[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavesight-train"
version = "0.1.0"
description = "WaveSight model training and dataset utilities"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cyber_Lord", email = "vladimir120307@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "datasets>=3.0",
    "tensorboard>=2.17",
    "wandb>=0.17",
    "click>=8.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
]

[project.scripts]
wavesight-train = "wavesight_train.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["wavesight_train", "tests"]

name: wavesight_mobile
description: WaveSight mobile app — live presence, fall alerts, family sharing.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  web_socket_channel: ^3.0.0
  http: ^1.2.1
  flutter_local_notifications: ^17.2.0
  shared_preferences: ^2.2.3
  go_router: ^14.2.1
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

name: python

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/python.yml"

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e training[dev]
      - name: ruff
        run: ruff check training
      - name: black --check
        run: black --check training
      - name: pytest
        run: pytest training -q

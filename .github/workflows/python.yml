name: python

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/python.yml"

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install
        working-directory: training
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: ruff
        working-directory: training
        run: ruff check wavesight_train
      - name: black --check
        working-directory: training
        run: black --check wavesight_train
      - name: pytest
        working-directory: training
        run: pytest -q

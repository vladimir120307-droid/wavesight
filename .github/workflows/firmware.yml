name: firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  esp32-csi-node:
    name: ESP32 CSI node build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: esp32s3
          path: firmware/esp32-csi-node

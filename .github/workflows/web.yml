name: web

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/web.yml"

jobs:
  lint-and-build:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: pnpm install
        # No lockfile yet — generated on first install. Once the lockfile
        # lands in the repo (post-M1), switch back to --frozen-lockfile.
        run: pnpm install
        working-directory: dashboard
      - name: typecheck
        run: pnpm typecheck
        working-directory: dashboard
      - name: build
        run: pnpm build
        working-directory: dashboard
      # lint and test are skipped until configs land in dashboard/ (next PR).

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Advisories only — yanked / duplicate noise is handled by cargo-deny
      # and reported as warnings, not failures, during alpha.
      - run: cargo audit || true

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    # cargo-deny periodically fails on transient crates.io registry errors during
    # the action's metadata fetch. Advisory, not blocking, while the dependency
    # set is still in flux. Revisit before tagging v1.0.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
          command-arguments: "--hide-inclusion-graph"

  pip-audit:
    name: pip-audit (training)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit --strict || true
        working-directory: training

  pnpm-audit:
    name: pnpm audit (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm audit --prod || true
        working-directory: dashboard

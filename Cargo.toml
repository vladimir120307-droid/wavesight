[workspace]
resolver = "2"
members = [
    "server/crates/wavesight-core",
    "server/crates/dsp",
    "server/crates/csi-ingest",
    "server/crates/fusion",
    "server/crates/inference",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["Cyber_Lord <vladimir120307@gmail.com>"]
repository = "https://github.com/vladimir120307-droid/wavesight"
homepage = "https://github.com/vladimir120307-droid/wavesight"
readme = "../../../README.md"
version = "0.1.0-alpha.1"

[workspace.dependencies]
tokio = { version = "1.39", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
hyper = { version = "1.4" }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
ndarray = { version = "0.16", features = ["serde"] }
rustfft = "6"
num-complex = "0.4"
candle-core = "0.6"
candle-nn = "0.6"
candle-transformers = "0.6"
safetensors = "0.4"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
parquet = "53"
arrow = "53"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.bench]
opt-level = 3
lto = "thin"
debug = true